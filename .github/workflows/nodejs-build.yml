name: nodejs-build

# Builds and tests a Node.js repo. Optional: a team may build in its own job instead.
# Mandatory scans are in scan.yml, which this does not run.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      working-directory:
        type: string
        default: "."
      run-tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: hashFiles('.github/actions/pre-build/action.yml') != ''
        uses: ./.github/actions/pre-build
      - run: npm ci
      - run: npm run build --if-present
      - if: inputs.run-tests
        run: npm test
      - if: hashFiles('.github/actions/post-build/action.yml') != ''
        uses: ./.github/actions/post-build
