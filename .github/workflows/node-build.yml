name: node-build

# Deprecated: use scan.yml@scan-v1 and nodejs-build.yml@nodejs-build-v1.
# v2: mandatory checks run in their own job and sign their result.
# Callers must grant id-token: write and attestations: write.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      working-directory:
        type: string
        default: "."
      run-tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Fresh runner, exact commit, no team code, no caches. Its result is signed with this
  # workflow's identity, which no team job can produce.
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      # Stand-in for a real secret scanner.
      - name: Secret scan
        run: |
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}'; then
            echo "::error::Possible secret committed"
            exit 1
          fi
      # Mock of a SonarQube analysis and its quality gate. A real one replaces this step only.
      - name: SonarQube (mock)
        id: sonar
        run: |
          echo "status=pass" >> "$GITHUB_OUTPUT"
          echo "source=mock" >> "$GITHUB_OUTPUT"
      - name: Write scan subject
        run: printf '%s@%s' "$GITHUB_REPOSITORY" "$SHA" > scan-subject.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: scan-subject.txt
          predicate-type: https://github.com/Stefan-org-1/ci-templates/scan/v1
          predicate: >-
            {"secret_scan": "pass", "sonarqube": "${{ steps.sonar.outputs.status }}",
            "sonarqube_source": "${{ steps.sonar.outputs.source }}"}

  # Team hooks run here, never in scan.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: hashFiles('.github/actions/pre-build/action.yml') != ''
        uses: ./.github/actions/pre-build
      - run: npm ci
      - run: npm run build --if-present
      - if: inputs.run-tests
        run: npm test
      - if: hashFiles('.github/actions/post-build/action.yml') != ''
        uses: ./.github/actions/post-build
