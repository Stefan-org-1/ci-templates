name: deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      VERSION: ${{ github.ref_name }}
      ENVIRONMENT: ${{ inputs.environment }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - run: echo "Deploying $REPO@$SHA ($VERSION) to $ENVIRONMENT"

      # Azure trusts this token only if its subject names this repo, this environment and this
      # template. A job the team writes gets a token naming the team's workflow, and is refused.
      - name: Log in to Azure with GitHub's OIDC token
        if: env.AZURE_CLIENT_ID != ''
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          # The claims are not secret; the signature is what makes the token usable.
          python3 -c 'import base64, json, sys; p = sys.argv[1].split(".")[1]; print("Token subject:", json.loads(base64.urlsafe_b64decode(p + "=="))["sub"])' "$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      # The mock deploy: record the version on the resource group.
      - name: Deploy
        if: env.AZURE_CLIENT_ID != ''
        run: |
          az tag update --operation Merge --output none \
            --resource-id "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP" \
            --tags "version=$VERSION" "sha=$SHA" "run=$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          echo "Tagged $AZURE_RESOURCE_GROUP with version=$VERSION"
